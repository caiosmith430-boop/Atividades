<body>

    <button onclick="verificarhora()">RODAR</button>
    <script>

      function verificarhora(){
        let hora = 14;

        if(hora < 12){
        console.log("Bom dia!");
      } 
        else if(hora < 18){
        console.log("Boa tarde!");
      }
        else{
        console.log("Boa noite!");
      } }
    </script>
