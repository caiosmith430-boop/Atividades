<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    botao{
        background-color: green;
        border-radius: 8px;
        border-width: 4px;
        padding: 8px;
        font-size: 20px;
    }
    input[type="text"]{
        border-radius: 8px;
        border-color: blue(93, 0, 112);
        font-size: 15px;
        background-color: aliceblue;

    }

    select{
        background-color: aliceblue;
    }

    select{
        border-radius: 8px;
        border-color: blue(93, 0, 112);
        padding: 8px;
    }

    label{
        font-size: 17px;
    }

    body{
        background-repeat: no-repeat;
        background-size: cover;
        background-color: rgb(36, 140, 201);
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to botton, hsl(195, 96%, 48%), #7594fa);
    }
   

</style>
<body>

<h1>Formulário de Cadastro</h1>
<form action="https://sheetdb.io/api/v1/6h8k47zzele4q" method="post">
    <fieldset>
        <label for="nome">Nome</label>
        <input type="text" name="data[nome]" id="nome">
<br>
        <label for="sobrenome">Sobrenome</label>
        <input type="text" name="data[sobrenome]" id="sobrenome">
<br>
        <label for="estado">Estado</label>
        <select name="estado">
            <option value="MG">MG</option>
            <option value="MG">SP</option>
            <option value="MG">RJ</option>
            <option value="MG">BA</option>
        </select>
<br>
        <label for="cpf">Cidade</label>
        <input type="text" name="data[cpf]" id="cpf">
<br>
        <input class="botao" type='submit' name="data[botão]" id='botão' value="Enviar dados">
    </fieldset>
  </form>
    
</body>
</html>
